layer1:
  enabled: true

layer2:
  enabled: true

layer3:
  enabled: true

# Allows drift observations without Layer 2 modifying candidate output.
passive_measurement: false

drift_score:
  # Provisional engineering defaults; not validated research findings.
  weights:
    boundary_violation: 0.30
    forbidden_action_attempt: 0.30
    role_similarity_deviation: 0.15
    schema_violation: 0.10
    instruction_deviation: 0.15

thresholds:
  # Provisional engineering defaults; subject to later recalibration.
  repair: 0.30
  reset: 0.60

limits:
  max_repair_attempts_per_turn: 2
  max_resets_per_turn: 1
