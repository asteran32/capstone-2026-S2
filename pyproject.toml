[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-role-harness"
version = "0.1.0"
description = "Research harness for role-consistent multi-agent LLM tutoring."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core",
    "langgraph",
    "pydantic",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
